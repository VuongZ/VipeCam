name: Deploy to Cloudflare Workers
# OpenNext cannot bundle the Worker on Windows (pnpm symlinks, `cloudflare:*` paths),
# so production builds and deploys run here on Linux.
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public origin, e.g. https://vipecam.<subdomain>.workers.dev or a custom domain.
      APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
      BETTER_AUTH_URL: ${{ vars.APP_URL || secrets.APP_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
    steps:
      - name: Check deployment configuration
        run: |
          missing=0
          for name in APP_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL BETTER_AUTH_SECRET \
                      R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret/variable: $name"; missing=1; fi
          done
          case "$APP_URL" in https://*) ;; *) echo "::error::APP_URL must start with https://"; missing=1;; esac
          case "$R2_PUBLIC_URL" in https://*) ;; *) echo "::error::R2_PUBLIC_URL must start with https://"; missing=1;; esac
          if [ ${#BETTER_AUTH_SECRET} -lt 32 ]; then echo "::error::BETTER_AUTH_SECRET must be at least 32 characters"; missing=1; fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Build Worker
        run: pnpm build:cloudflare
      - name: Deploy Worker
        run: pnpm deploy:cloudflare
      - name: Upload runtime secrets
        run: |
          node -e '
            const keys = ["DATABASE_URL","BETTER_AUTH_SECRET","BETTER_AUTH_URL","NEXT_PUBLIC_APP_URL",
              "R2_ACCOUNT_ID","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","R2_BUCKET_NAME","R2_PUBLIC_URL"];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json",
              JSON.stringify(Object.fromEntries(keys.map(k => [k, process.env[k]]))));
          '
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
