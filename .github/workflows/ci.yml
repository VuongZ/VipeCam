name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vipecam_ci
          POSTGRES_USER: vipecam_ci
          POSTGRES_PASSWORD: ci-only-local-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vipecam_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vipecam_ci:ci-only-local-password@localhost:5432/vipecam_ci
      TEST_DATABASE_URL: postgresql://vipecam_ci:ci-only-local-password@localhost:5432/vipecam_ci
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-for-deployment-000000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:cloudflare
